[package]
name = "nazar"
version = "0.1.0"
edition = "2021"
description = "A port scanner that shows its receipts"
license = "MIT"
repository = "https://github.com/volkansync/rust-portscanner"
keywords = ["security", "network", "scanner", "portscan"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "nazar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ipnet = "2.12.2"
